    <meta property="og:description" content="Nền tảng hỗ trợ giáo viên Tin học quản lý tiết thực hành phòng máy: học sinh nộp bài theo nhóm/cá nhân, chấm điểm tự động tức thì theo thang điểm 10, cho phép nộp lại nhiều lần để đạt điểm tối đa, theo dõi trực tiếp và xuất file Excel báo cáo chi tiết theo lớp." />

    <script>
      // Đảm bảo window.fetch có cả getter và setter để các tiện ích mở rộng trình duyệt (extension)
      // không bị lỗi "TypeError: Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          var initialFetch = window.fetch;
          var activeFetch = initialFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() { return activeFetch; },
            set: function(fn) { activeFetch = fn; }
          });
        } catch (e) {}

        // Chặn các lỗi phát sinh ngoài ý muốn từ tiện ích mở rộng Chrome/trình duyệt
        window.addEventListener('error', function(event) {
          if (event && (
            (event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
            (event.message && event.message.indexOf('Cannot set property fetch') !== -1)
          )) {
            event.preventDefault();
            event.stopPropagation();
            return false;
          }
        }, true);
      })();
    </script>
